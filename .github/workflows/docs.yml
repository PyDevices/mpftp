# The mpftp docs site, built the way Read the Docs builds it from
# .readthedocs.yaml. -W turns a warning into a failure, as fail_on_warning
# does there.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install docs requirements
        run: pip install -r docs/requirements.txt
      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs _site
