# Attach a VSIX build to an already-published GitHub Release.
#
# Trigger: `release: published` — the same event that fans out to
# publish-release-packages.yml, so one `gh release create` (per the org
# runbook in dotgithub/docs/publishing-automation.md) produces both the
# TestPyPI upload and this VSIX. This workflow does not create the release
# itself: a release created by GITHUB_TOKEN would not re-fire `release`
# events, silently breaking that fan-out.
#
# The extension's own version lives in extension/package.json, already held
# equal to the root VERSION file by scripts/check_versions.py in CI before
# every merge to main — so by release time nothing here needs to compute or
# rewrite a version, only confirm the tag agrees with what was committed.
#
# Optional repository secrets:
#   VSCE_PAT — VS Marketplace publish
#   OVSX_PAT — Open VSX publish

name: Publish VSIX

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'PyDevices/mpftp'
    steps:
      - name: Resolve the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-ref }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Run this from a published release, or pass release-ref for a workflow_dispatch retry." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.tag }}

      - name: Confirm the tag matches the committed VERSION
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag" != "v$SOURCE_VERSION" ]]; then
            echo "Release tag $tag does not match VERSION ($SOURCE_VERSION)." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install and package VSIX
        working-directory: extension
        run: |
          set -euo pipefail
          npm ci
          npm run package
          ls -la *.vsix

      - name: Attach the VSIX to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag }}
          files: |
            extension/*.vsix

      - name: Publish to VS Marketplace (optional)
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT not set — skipping VS Marketplace publish"
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"

      - name: Publish to Open VSX (optional)
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "OVSX_PAT not set — skipping Open VSX publish"
            exit 0
          fi
          VSIX="$(ls -1 *.vsix | head -1)"
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT"
