# CI for both halves of the repo: the Python engine and the TypeScript extension.
#
# Runs on every pull request so a change is verified before it reaches main.
# Path filters are deliberately absent: a release-version or workflow change
# has to be checked too, and the whole run takes under a minute.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run lint

      - name: Build and check cli/src/mpftp/webui is not stale
        working-directory: ui
        run: |
          npm run build
          # The page carries the extension's File Transfer panel (extension/media),
          # so an edit there needs a rebuild too. Untracked output counts as stale.
          test -z "$(git status --porcelain -- ../cli/src/mpftp/webui)" || {
            git status --short -- ../cli/src/mpftp/webui
            echo "::error::cli/src/mpftp/webui is out of date — run 'npm run build' in ui/ and commit the result."
            exit 1
          }

  python:
    # Both ends of pyproject's mpremote range: mpftp subclasses mpremote's
    # SerialTransport, so a release can break it without an API change.
    name: python (mpremote ${{ matrix.mpremote }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mpremote: ['1.28.0', '1.29.0']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install tooling, and the package with its pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check build ruff twine . "mpremote==${{ matrix.mpremote }}"
          # The mpremote tests skip when it is missing; fail here instead.
          python -c "import mpremote, serial; print('mpremote', mpremote.__version__, 'pyserial', serial.__version__)"

      - name: Ruff
        run: ruff check cli scripts

      - name: Unit tests
        env:
          PYTHONPATH: cli/src
        run: python -m unittest discover -s cli/tests -v

      - name: Build the distribution
        run: |
          python -m build .
          python -m twine check dist/*

      - name: Versions agree across every deliverable
        run: python scripts/check_versions.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Packaging bundles mpremote and pyserial with pip (stage-vendored-python.sh).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run lint

      - name: Unit tests
        working-directory: extension
        run: npm test

      - name: Package VSIX
        working-directory: extension
        run: |
          npm run package
          # The bundled copies and their licences are in the package.
          for f in mpremote/transport_serial.py serial/serialwin32.py \
                   LICENSES/mpremote-LICENSE LICENSES/pyserial-LICENSE.txt; do
            unzip -l ./*.vsix | grep -F "extension/python/_vendor/$f"
          done

