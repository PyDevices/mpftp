# CI for both halves of the repo: the Python engine and the TypeScript extension.
#
# Runs on every pull request so a change is verified before it reaches main.
# Path filters are deliberately absent: a release-version or workflow change
# has to be checked too, and the whole run takes under a minute.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run lint

      - name: Build and check cli/src/mpftp/webui is not stale
        working-directory: ui
        run: |
          npm run build
          git diff --exit-code -- ../cli/src/mpftp/webui || {
            echo "::error::cli/src/mpftp/webui is out of date — run 'npm run build' in ui/ and commit the result."
            exit 1
          }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check build ruff twine

      - name: Ruff
        run: ruff check cli scripts

      - name: Unit tests
        env:
          PYTHONPATH: cli/src
        run: python -m unittest discover -s cli/tests -v

      - name: Build the distribution
        run: |
          python -m build .
          python -m twine check dist/*

      - name: Versions agree across every deliverable
        run: python scripts/check_versions.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run lint

      - name: Package VSIX
        working-directory: extension
        run: npm run package
