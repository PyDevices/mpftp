[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuctl"
dynamic = ["version"]
description = "MicroPython and CircuitPython board tools: serial sessions, file transfer, REPL, package install, and firmware build/download/flash"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Brad Barnett" }]
keywords = ["micropython", "circuitpython", "mpremote", "circup", "esp32", "firmware", "serial", "repl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
]

# Every runtime capability is available from a default install. There are no
# feature extras to discover; only development tooling is optional.
#
# mpremote and pyserial are bounded to the range CI tests: mcuctl subclasses
# mpremote's SerialTransport and calls its internals, which change between
# releases. circup and esptool are only run through their command lines, so
# they stay unbounded. bleak (Bluetooth, ble://) is called through its public
# API, bounded below by the first release with the calls mcuctl makes and
# above by the newest major version it has been run on.
# extension/vendor-requirements.txt bundles one version of mpremote and
# pyserial from inside these ranges into the VSIX; bleak has native parts per
# platform, so the extension leaves it to the sidecar's Python.
dependencies = [
  "mpremote>=1.28,<1.30",
  "pyserial>=3.5,<4",
  "circup",
  "esptool",
  "bleak>=1.0,<4",
]

[project.optional-dependencies]
dev = ["build", "ruff", "twine"]

[project.scripts]
mcuctl = "mcuctl.cli:main"

[project.urls]
Homepage = "https://github.com/PyDevices/mcuctl"
Issues = "https://github.com/PyDevices/mcuctl/issues"

[tool.setuptools.packages.find]
where = ["cli/src"]

[tool.setuptools.package-data]
# VERSION: staged next to the package when vendored into the VSIX, which is
# never pip-installed and so has no distribution metadata to read a version
# from. webui/**: the built PWA (`npm run build` in ui/) — see mcuctl.pwa.
# py.typed: the package's own annotations are its types (PEP 561), so mypy and
# editors read them from an installed copy.
mcuctl = ["VERSION", "webui/**", "py.typed"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = ["E", "F", "I", "W", "B", "SIM"]
lint.ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"cli/tests/**" = ["F401"]
