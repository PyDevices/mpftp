[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-mpftp"
dynamic = ["version"]
description = "MicroPython and CircuitPython board tools: serial sessions, file transfer, REPL, package install, and firmware build/download/flash"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Brad Barnett" }]
keywords = ["micropython", "circuitpython", "mpremote", "circup", "esp32", "firmware", "serial", "repl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
]

# Every runtime capability is available from a default install. There are no
# feature extras to discover; only development tooling is optional.
dependencies = [
  "mpremote",
  "circup",
  "esptool",
]

[project.optional-dependencies]
dev = ["build", "ruff", "twine"]

[project.scripts]
mpftp = "mpftp.cli:main"
mpftp-mcp = "mpftp.mcp:main"

[project.urls]
Homepage = "https://github.com/PyDevices/mpftp"
Issues = "https://github.com/PyDevices/mpftp/issues"

[tool.setuptools.packages.find]
where = ["cli/src"]

[tool.setuptools.package-data]
# Staged next to the package when vendored into the VSIX, which is never
# pip-installed and so has no distribution metadata to read a version from.
mpftp = ["VERSION"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = ["E", "F", "I", "W", "B", "SIM"]
lint.ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"cli/tests/**" = ["F401"]
