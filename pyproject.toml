[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-mpftp"
dynamic = ["version"]
description = "MicroPython and CircuitPython board tools: serial sessions, file transfer, REPL, package install, and firmware build/download/flash"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Brad Barnett" }]
keywords = ["micropython", "circuitpython", "mpremote", "circup", "esp32", "firmware", "serial", "repl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
]

# Every runtime capability is available from a default install. There are no
# feature extras to discover; only development tooling is optional.
#
# mpremote and pyserial are bounded to the range CI tests: mpftp subclasses
# mpremote's SerialTransport and calls its internals, which change between
# releases. circup and esptool are only run through their command lines, so
# they stay unbounded. extension/vendor-requirements.txt bundles one version
# of mpremote and pyserial from inside these ranges into the VSIX.
dependencies = [
  "mpremote>=1.28,<1.30",
  "pyserial>=3.5,<4",
  "circup",
  "esptool",
]

[project.optional-dependencies]
dev = ["build", "ruff", "twine"]

[project.scripts]
mpftp = "mpftp.cli:main"

[project.urls]
Homepage = "https://github.com/PyDevices/mpftp"
Issues = "https://github.com/PyDevices/mpftp/issues"

[tool.setuptools.packages.find]
where = ["cli/src"]

[tool.setuptools.package-data]
# VERSION: staged next to the package when vendored into the VSIX, which is
# never pip-installed and so has no distribution metadata to read a version
# from. webui/**: the built PWA (`npm run build` in ui/) — see mpftp.pwa.
mpftp = ["VERSION", "webui/**"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py39"
line-length = 100
lint.select = ["E", "F", "I", "W", "B", "SIM"]
lint.ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"cli/tests/**" = ["F401"]
