[package]
name = "mpftp-desktop"
# Not the app's version: tauri.conf.json reads that from desktop/package.json,
# which follows the root VERSION file with everything else.
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "mpftp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
