<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e1e;
    --bar: #252526;
    --fg: #cccccc;
    --dim: #8a8a8a;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #3794ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px system-ui, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  #state {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  #state.ready { background: #3fb950; }
  #state.busy { background: #d29922; }
  #status { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  select, button {
    background: #3c3c3c;
    color: var(--fg);
    border: 1px solid transparent;
    border-radius: 4px;
    font: inherit;
    height: 24px;
    padding: 0 8px;
  }
  button { cursor: pointer; }
  button:hover, select:hover { background: #4a4a4a; }
  button[aria-pressed="true"] { border-color: var(--accent); color: #fff; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
  }
  #empty { color: var(--dim); text-align: center; line-height: 1.5; }
  #bezel {
    display: none;
    padding: 10px;
    background: #111;
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px var(--line), 0 6px 18px rgba(0, 0, 0, 0.45);
  }
  #bezel.round { border-radius: 50%; padding: 12px; }
  body.has-display #bezel { display: block; }
  body.has-display #empty { display: none; }
  #display_canvas {
    display: block;
    image-rendering: pixelated;
    background: #000;
    outline: none;
  }
  #display_canvas.round { border-radius: 50%; }
  #aux_canvas { display: none; }
</style>
</head>
<body>
  <div id="bar">
    <span id="state" title="Starting"></span>
    <span id="status">Starting…</span>
    <select id="size" title="Display size (resets the emulator)">
      <option value="320x240">320 × 240</option>
      <option value="240x320">240 × 320</option>
      <option value="240x240">240 × 240</option>
      <option value="240x240-round">240 × 240 round</option>
      <option value="466x466-round">466 × 466 round</option>
      <option value="480x320">480 × 320</option>
      <option value="320x480">320 × 480</option>
      <option value="800x480">800 × 480</option>
    </select>
    <button id="zoom" title="Zoom">1×</button>
    <button id="pin" title="Keep on top" aria-pressed="false">Pin</button>
    <button id="reset" title="Reset: stop the program and restart the interpreter">Reset</button>
  </div>
  <div id="stage">
    <div id="empty">No display yet.<br>A program that opens one draws here.</div>
    <div id="bezel"><canvas id="display_canvas" width="320" height="240" tabindex="0"></canvas></div>
  </div>
  <canvas id="aux_canvas" width="1" height="1"></canvas>
  <script type="module" src="emulator.js"></script>
</body>
</html>
