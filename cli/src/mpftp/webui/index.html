<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem('mpftp-theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mpftp</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/app.css" />
  <meta name="theme-color" content="#090d16" />
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="mp-header">
    <div class="mp-header-left">
      <span class="mp-brand">
        <span class="mp-brand-title">mpftp</span>
        <span class="mp-brand-badge">BOARD</span>
      </span>
    </div>

    <div class="mp-header-center">
      <div class="mp-select-wrap">
        <select id="port-select" aria-label="Serial port"></select>
      </div>
      <button type="button" class="mp-btn mp-btn-primary" id="connect-btn">Connect</button>
      <button type="button" class="mp-btn" id="disconnect-btn" disabled>Disconnect</button>
    </div>

    <div class="mp-header-right">
      <div class="mp-status-indicator">
        <span class="mp-status-dot" id="status-dot"></span>
        <span id="status-text">Not connected</span>
      </div>
      <button type="button" class="mp-btn mp-icon-btn" id="theme-toggle" aria-label="Toggle color theme" title="Toggle light/dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="mp-workspace" id="workspace">
    <section class="mp-editor-pane" id="editor-pane" aria-label="Code editor">
      <div class="mp-pane-header">
        <div class="mp-program" id="program-info">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span id="program-name">No file open</span>
          <span class="mp-program-dirty" id="program-dirty" role="img" aria-label="Unsaved changes" hidden></span>
        </div>
        <button type="button" class="mp-btn" id="save-btn" disabled title="Save back to the board (Ctrl+S)">
          Save<kbd>Ctrl+S</kbd>
        </button>
      </div>
      <div class="mp-editor-container" id="editor-container"></div>
    </section>

    <div class="mp-splitter-v" id="splitter-v" role="separator" aria-orientation="vertical"></div>

    <section class="mp-side-pane" id="side-pane" aria-label="File transfer and REPL">
      <section class="mp-files-pane" id="files-stage" aria-label="File transfer">
        <div class="mp-pane-header">
          <button class="mp-icon-btn mp-btn" data-action="up" title="Up one level" aria-label="Up one level">⬆</button>
          <span class="mp-files-path" id="files-path">/</span>
          <span class="mp-spacer"></span>
          <button type="button" class="mp-btn" data-action="mkdir">New folder</button>
          <label class="mp-btn mp-upload">
            Upload
            <input type="file" id="upload-input" multiple style="display:none" />
          </label>
        </div>
        <ul class="mp-files-list" id="files-list"></ul>
      </section>

      <div class="mp-splitter-h" id="splitter-h" role="separator" aria-orientation="horizontal"></div>

      <section class="mp-console-pane" id="console-pane" aria-label="REPL">
        <div class="mp-pane-header">
          <div class="mp-tab">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span>REPL</span>
          </div>
        </div>
        <div class="mp-terminal-body" id="repl"></div>
      </section>
    </section>
  </main>
</body>
</html>
